name: Check
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Build isolated workshop image
        run: docker build -t theartist-workshop:1 -f docker/workshop.Dockerfile docker
      - run: npm test
        env:
          TEST_DOCKER: '1'
      - name: Verify recovered founder prototype
        run: python3 -B -m unittest discover -s examples/rfp-prototype -p 'test_*.py' -v
      - name: Exercise prototype sample
        run: python3 -B examples/rfp-prototype/run_sample.py --out "$RUNNER_TEMP/rfp-sample"
