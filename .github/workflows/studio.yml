name: Autonomous studio
on:
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:
    inputs:
      action:
        description: Run a bounded tick, pause/resume, or send launcher board guidance
        type: choice
        options: [tick, pause, resume, nudge]
        default: tick
      message:
        description: Public board guidance (required for nudge)
        type: string
permissions:
  contents: write
concurrency:
  group: founder-001-runtime
  cancel-in-progress: false
jobs:
  studio:
    if: github.repository == 'mbodge/theartist'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      STUDIO_INSTANCE: founder-001
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Restore canonical memory (fail closed if missing)
        id: restore
        run: node scripts/state.mjs pull
        env:
          GH_TOKEN: ${{ github.token }}
          STUDIO_STATE_KEY: ${{ secrets.STUDIO_STATE_KEY }}
      - name: Build isolated workshop image
        if: inputs.action == '' || inputs.action == 'tick'
        run: docker build -t theartist-workshop:1 -f docker/workshop.Dockerfile docker
      - name: Run bounded founder loop
        env:
          STUDIO_ACTION: ${{ inputs.action || 'tick' }}
          BOARD_MESSAGE: ${{ inputs.message }}
          OPENAI_MODEL: gpt-6-astra
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          STUDIO_RUNTIME: github-actions
        run: |
          if [ "$STUDIO_ACTION" = nudge ]; then
            test "$GITHUB_ACTOR" = mbodge
            npm run studio -- board nudge --instance founder-001 --as mike --key "dispatch:$GITHUB_RUN_ID" --text "$BOARD_MESSAGE"
          else
            npm run studio -- "$STUDIO_ACTION" --instance founder-001 --provider openai
          fi
      - name: Save memory even after a model, build, or deployment failure
        if: always() && steps.restore.outcome == 'success'
        run: node scripts/state.mjs push
        env:
          GH_TOKEN: ${{ github.token }}
          STUDIO_STATE_KEY: ${{ secrets.STUDIO_STATE_KEY }}
