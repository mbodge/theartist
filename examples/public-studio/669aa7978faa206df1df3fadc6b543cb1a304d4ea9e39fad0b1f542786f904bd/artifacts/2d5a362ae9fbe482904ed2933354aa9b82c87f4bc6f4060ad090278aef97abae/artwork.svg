<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1600" viewBox="0 0 1200 1600"><title>Instructions for an absent audience</title><rect width="1200" height="1600" fill="#EEECE5"/><g font-family="sans-serif"><text x="100" y="260" font-size="48" font-weight="700" text-anchor="start" fill="#222222">FOR AN ABSENT AUDIENCE</text>
<text x="100" y="338" font-size="31" font-weight="400" text-anchor="start" fill="#222222">Prepare a room.</text>
<text x="100" y="416" font-size="31" font-weight="400" text-anchor="start" fill="#222222">Leave one place unassigned.</text>
<text x="100" y="494" font-size="31" font-weight="400" text-anchor="start" fill="#222222">Keep the light on until the stated hour.</text>
<text x="100" y="572" font-size="31" font-weight="400" text-anchor="start" fill="#222222">Record what was prepared.</text>
<text x="100" y="650" font-size="31" font-weight="400" text-anchor="start" fill="#222222">Do not record an encounter that did not happen.</text>
<text x="100" y="728" font-size="23" font-weight="400" text-anchor="start" fill="#D44327">An instruction is not evidence of its performance.</text></g><path d="M100 1440H1100" stroke="#D44327" stroke-width="2"/></svg>